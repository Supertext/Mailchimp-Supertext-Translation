name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The built app against the stand-in Mailchimp and Supertext APIs: OAuth,
      # settings, a translation from the app and one from a Supertext folder.
      - name: Smoke test against the stand-ins
        run: bash scripts/smoke.sh
