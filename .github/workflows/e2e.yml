name: E2E

# The app's Docker image (as Railway builds it) against the REAL Supertext API: language list
# check and the end-to-end test (tests/e2e). There is no Mailchimp account in CI: the app talks
# to the stand-in Mailchimp (tests/standin), and the test checks the drafts it received.
# Then the docs screenshots against the stand-in Mailchimp AND Supertext APIs (tests/docs), so
# the images don't change with every machine translation. Changed images become a pull request.
# See "End-to-end tests" and "Screenshots" in docs/DEVELOPER.md.

on:
  workflow_dispatch:
  # A pull request that changes the E2E test itself runs it before merging.
  pull_request:
    paths:
      - 'tests/e2e/**'
      - '.github/workflows/e2e.yml'
  schedule:
    - cron: '7 6 * * 1' # Mondays, 06:07 UTC
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'vendor/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'Dockerfile'
      - 'tests/**'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    name: E2E (live API) and screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      images-changed: ${{ steps.images.outputs.changed }}
    env:
      APP_URL: http://127.0.0.1:8081
      MAILCHIMP_URL: http://127.0.0.1:8766
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the app image (cached between runs)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          tags: mailchimp-supertext-app
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The app has no accounts of its own (users sign in through Mailchimp's OAuth, here the
      # stand-in's); only its secrets are made per run.
      - name: App secrets for this run only
        run: |
          for v in SESSION_SECRET APP_ENCRYPTION_KEY MAILCHIMP_CLIENT_SECRET; do
            value="$(openssl rand -hex 16)"
            echo "::add-mask::$value"
            echo "$v=$value" >> "$GITHUB_ENV"
          done

      - name: Install the test tools
        run: |
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      # --- 1. Real Supertext API, stand-in Mailchimp ------------------------------------------
      - name: Check for the API key
        id: key
        env:
          SUPERTEXT_API_KEY: ${{ secrets.SUPERTEXT_API_KEY }}
        run: |
          if [ -n "$SUPERTEXT_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secret SUPERTEXT_API_KEY is not set: skipping the tests against the real Supertext API (see docs/DEVELOPER.md → End-to-end tests)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Start the stand-in Mailchimp and the app against the real API
        if: steps.key.outputs.present == 'true'
        env:
          SUPERTEXT_API_KEY: ${{ secrets.SUPERTEXT_API_KEY }}
        run: |
          # Stand-in Mailchimp on :8766 (its stand-in Supertext on :8765 isn't used here).
          nohup npx tsx tests/standin/server.ts > standin-live.log 2>&1 &
          # Version reports off: CI runs are no installations for the Commando Center.
          docker run -d --name app-live --network host \
            -e PORT=8081 -e APP_URL \
            -e MAILCHIMP_CLIENT_ID=e2e -e MAILCHIMP_CLIENT_SECRET -e MAILCHIMP_LOGIN_BASE="$MAILCHIMP_URL" \
            -e SESSION_SECRET -e APP_ENCRYPTION_KEY \
            -e SUPERTEXT_API_KEY -e SUPERTEXT_VERSION_REPORTS=0 -e FOLDER_POLL_SECONDS=0 \
            mailchimp-supertext-app
          timeout 120 sh -c "until curl -sf -o /dev/null $APP_URL/health && curl -sf -o /dev/null -H 'Authorization: Bearer standin-token' $MAILCHIMP_URL/3.0/ping; do sleep 2; done" \
            || { docker logs app-live; cat standin-live.log; exit 1; }

      - name: Language list against the real API
        if: steps.key.outputs.present == 'true'
        env:
          SUPERTEXT_API_KEY: ${{ secrets.SUPERTEXT_API_KEY }}
          E2E_SOURCE: en
          E2E_TARGETS: de-CH,fr-CH,it-CH
        run: |
          node tests/e2e/features.mjs

      - name: End-to-end test against the real API
        if: steps.key.outputs.present == 'true'
        run: npx tsx tests/e2e/live.ts

      # --- 2. Docs screenshots against the stand-ins ---------------------------------------------
      # tests/docs/screenshots.ts runs the app and both stand-ins in-process (version reports
      # go to the stand-in's /report).
      - name: Screenshots against the stand-in APIs
        if: success() || failure()
        run: npm run docs:screenshots

      - name: Did the screenshots change?
        id: images
        if: success() || failure()
        run: |
          if [ -n "$(git status --porcelain docs/images)" ]; then
            git status --short docs/images
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the screenshots
        if: steps.images.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-images
          path: docs/images/

      - name: Collect logs for debugging
        if: failure()
        run: |
          mkdir -p e2e-debug
          cp -r tests/e2e/artifacts e2e-debug/ 2>/dev/null || true
          cp standin-live.log e2e-debug/ 2>/dev/null || true
          docker logs app-live > e2e-debug/app-live.log 2>&1 || true

      - name: Upload logs for debugging
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-debug
          path: e2e-debug/
          retention-days: 7

  screenshots-pr:
    name: Pull request with new screenshots
    needs: e2e
    if: needs.e2e.outputs.images-changed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-images
          path: docs/images/

      - name: Push a branch and open (or update) the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          branch=automation/docs-screenshots
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add docs/images
          git commit -m "Docs: regenerate screenshots" -m "Made by the E2E workflow: $RUN_URL"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$branch"
          if [ -z "$(gh pr list --repo "$REPO" --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --repo "$REPO" --head "$branch" --base main \
              --title "Docs: regenerate screenshots" \
              --body "The E2E workflow took new screenshots of the app (against the stand-in APIs) and they differ from \`docs/images/\`. Check that the changes are intended before merging. Run: $RUN_URL"
          fi
